<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Trinium Flow · Atlas Driver App Fabric</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2300243d'/%3E%3Cpath d='M7 22V10l9 7 9-7v12' fill='none' stroke='%2342b0d5' stroke-width='2.6' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<aside class="side" aria-label="Main navigation">
  <div class="brand">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="26" height="26"><path d="M6 23V9l10 8 10-8v14" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <div class="brand-name">Trinium Flow</div>
      <div class="brand-sub">Atlas Driver App Fabric</div>
    </div>
  </div>

  <nav class="nav" id="nav">
    <a href="#/overview" data-nav="overview"><span class="ico" aria-hidden="true">◎</span>Overview</a>
    <a href="#/orders" data-nav="orders"><span class="ico" aria-hidden="true">▤</span>Orders</a>
    <a href="#/events" data-nav="events"><span class="ico" aria-hidden="true">⇄</span>App events → 214</a>
    <a href="#/logs" data-nav="logs"><span class="ico" aria-hidden="true">≡</span>Logs</a>
    <a href="#/issues" data-nav="issues"><span class="ico" aria-hidden="true">!</span>Issues<span class="count" id="badge-issues" hidden></span></a>
    <a href="#/files" data-nav="files"><span class="ico" aria-hidden="true">▦</span>Files &amp; SFTP</a>
    <a href="#/about" data-nav="about"><span class="ico" aria-hidden="true">i</span>About &amp; health</a>
  </nav>

  <div class="side-foot">
    <span class="env-tag">Read-only</span>
    <p class="small">Database sessions are read-only. There is no sign-in on this page: keep it on loopback or behind your own access control.</p>
  </div>
</aside>

<div class="shell">
  <header class="top">
    <div class="crumbs" id="crumbs" aria-live="polite"></div>
    <div class="grow"></div>
    <label class="ctl">
      <span>Window</span>
      <select id="hours" aria-label="Time window">
        <option value="1">1 h</option>
        <option value="6">6 h</option>
        <option value="24" selected>24 h</option>
        <option value="72">3 days</option>
        <option value="168">7 days</option>
      </select>
    </label>
    <button class="btn ghost" id="refresh" type="button">Refresh</button>
    <button class="btn ghost" id="auto" type="button" aria-pressed="true" title="Refresh every 10 seconds">
      <span class="dot live" id="auto-dot" aria-hidden="true"></span><span id="auto-label">Live</span>
    </button>
    <button class="btn ghost" id="theme" type="button" aria-label="Switch colour theme" title="Switch colour theme">Theme</button>
    <span class="stamp" id="stamp" aria-live="off"></span>
  </header>

  <main id="main" tabindex="-1">
    <div class="loading">Loading…</div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:24px">This dashboard needs JavaScript.</p></noscript>
<script src="app.js"></script>
</body>
</html>
