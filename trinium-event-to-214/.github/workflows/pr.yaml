name: Pull Request
on: pull_request
permissions:
  id-token: write # required for hashicorp/vault-action
  contents: read # required for actions/checkout
concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref }}"
  cancel-in-progress: true
jobs:
  Execute:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE_TAG: "${{ github.head_ref }}-${{ github.sha }}"
    steps:
      - name: Import Secrets
        uses: hashicorp/vault-action@v2
        with:
          url: "https://mss.maersk.io/"
          method: jwt
          path: github-jwt
          role: "TODO-vault-role-for-this-repo"
          secrets: |
            landsidemilestones-nonprod-kv/data/platform--harbor/push server | CONTAINER_REGISTRY_SERVER;
            landsidemilestones-nonprod-kv/data/platform--harbor/push username | CONTAINER_REGISTRY_USERNAME;
            landsidemilestones-nonprod-kv/data/platform--harbor/push password | CONTAINER_REGISTRY_PASSWORD;
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY_SERVER }}
          username: ${{ env.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ env.CONTAINER_REGISTRY_PASSWORD }}
      - name: Sanitize Image Tag
        run: echo "DOCKER_IMAGE_TAG=${DOCKER_IMAGE_TAG//[^a-zA-Z0-9-_]/}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: amd64
          tags: "${{ env.CONTAINER_REGISTRY_SERVER }}/landsidemilestones/trinium-event-to-214:${{ env.DOCKER_IMAGE_TAG }}"
          labels: "org.opencontainers.image.revision=${{ github.sha }}"
          push: true
      - name: Output Docker Image Tag
        run: |
          echo "Docker image has been pushed with tag:"
          echo "${{ env.CONTAINER_REGISTRY_SERVER }}/landsidemilestones/trinium-event-to-214:${{ env.DOCKER_IMAGE_TAG }}"
          echo "DOCKER_IMAGE_TAG=${{ env.DOCKER_IMAGE_TAG }}" >> "$GITHUB_ENV"
